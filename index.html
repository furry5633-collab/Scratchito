:root{
  /* Colores oficiales de categoría (Scratch 3.0) */
  --motion:#4C97FF;    --motion-d:#3373CC;
  --looks:#9966FF;     --looks-d:#774DCB;
  --sound:#CF63CF;     --sound-d:#A63FA6;
  --events:#FFBF00;    --events-d:#CC9900;
  --control:#FFAB19;   --control-d:#CF8B17;
  --sensing:#5CB1D6;   --sensing-d:#2E8EB8;
  --operators:#59C059; --operators-d:#389438;
  --variables:#FF8C1A; --variables-d:#DB6E00;
  --myblocks:#0FBD8C;  --myblocks-d:#0B8E69;

  /* Interfaz */
  --brand:#5A4BE8;
  --brand-2:#8C6BFF;
  --accent:#4C97FF;
  --ink:#2B2F45;
  --ink-2:#5A6079;
  --ink-3:#8E94AB;
  --line:#E4E7F0;
  --line-2:#EDF0F7;
  --panel:#FFFFFF;
  --bg:#EEF1F8;
  --canvas-bg:#F5F7FC;
  --sh-1:0 1px 2px rgba(23,28,61,.06), 0 1px 3px rgba(23,28,61,.05);
  --sh-2:0 2px 6px rgba(23,28,61,.07), 0 6px 18px rgba(23,28,61,.07);
  --sh-3:0 12px 40px rgba(23,28,61,.20);
  --r:14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --ic-search: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27black%27%20stroke-width%3D%271.9%27%20stroke-linecap%3D%27round%27%3E%3Ccircle%20cx%3D%2711%27%20cy%3D%2711%27%20r%3D%276.5%27%2F%3E%3Cpath%20d%3D%27M16%2016l4.5%204.5%27%2F%3E%3C%2Fsvg%3E");
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink-2);font-size:13.5px;line-height:1.35;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CFD5E6;border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#B6BED6;background-clip:content-box;border:3px solid transparent}

/* ===================== ESTRUCTURA ===================== */
#app{display:flex;flex-direction:column;height:100dvh;height:100vh}

/* --------- Barra superior --------- */
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:6px;padding:0 14px;
  background:linear-gradient(135deg,#5A4BE8 0%,#7B5CF0 45%,#4C97FF 100%);
  color:#fff;position:relative;z-index:60;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 2px 14px rgba(40,44,90,.28);
}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.2px;margin-right:12px}
.logo .cat{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:19px;
  background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)
}
.logo .t{background:linear-gradient(180deg,#fff,#E4E9FF);-webkit-background-clip:text;background-clip:text;color:transparent}

.tbtn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;
  font-size:13px;font-weight:600;color:#F2F4FF;white-space:nowrap;
  background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  transition:background .15s, transform .12s, box-shadow .15s;
}
.tbtn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.tbtn:active{transform:translateY(0)}
.tbtn.primary{background:rgba(255,255,255,.95);color:var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tbtn.primary:hover{background:#fff}
.sep{width:1px;height:24px;background:rgba(255,255,255,.22);margin:0 6px}
.spacer{flex:1}
.projname{
  background:rgba(255,255,255,.14);border:none;outline:none;color:#fff;font-weight:600;font-size:13.5px;
  padding:8px 12px;border-radius:10px;width:190px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.projname::placeholder{color:rgba(255,255,255,.6)}
.projname:focus{background:rgba(255,255,255,.24)}

.main{flex:1;display:flex;min-height:0;gap:10px;padding:10px;position:relative}

.runbar,.codeswitch{display:none}

/* --------- Columna editor --------- */
.editor{
  flex:1;display:flex;min-width:0;background:var(--panel);border-radius:var(--r);
  box-shadow:var(--sh-2);overflow:hidden
}

/* Rail de categorías */
.cats{
  width:78px;flex:0 0 78px;overflow-y:auto;overflow-x:hidden;padding:8px 0 20px;
  background:linear-gradient(180deg,#FBFCFE,#F4F6FC);border-right:1px solid var(--line-2)
}
.cat-item{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
  width:100%;padding:9px 3px;font-size:10px;font-weight:700;color:var(--ink-3);text-align:center;
  transition:color .15s
}
.cat-item .cat-dot{
  width:26px;height:26px;border-radius:50%;
  box-shadow:0 2px 5px rgba(23,28,61,.18), inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .15s, box-shadow .15s
}
.cat-item:hover{color:var(--ink)}
.cat-item:hover .cat-dot{transform:scale(1.12)}
.cat-item.active{color:var(--ink)}
.cat-item.active .cat-dot{transform:scale(1.15);box-shadow:0 0 0 4px rgba(90,75,232,.12),0 3px 8px rgba(23,28,61,.2)}
.cat-item.active:before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)
}

/* Paleta */
.palette{
  width:244px;flex:0 0 244px;overflow-y:auto;overflow-x:auto;padding:14px 12px 140px;
  background:#fff;border-right:1px solid var(--line-2);-webkit-overflow-scrolling:touch
}
.pal-title{
  display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--ink);
  margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line-2)
}
.pal-title .bubble-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:#fff}
.pal-note{
  font-size:11.5px;color:var(--ink-3);background:var(--line-2);border-radius:9px;padding:8px 10px;margin-bottom:12px;line-height:1.45
}

/* Lienzo de código */
.canvas-wrap{
  flex:1;position:relative;overflow:hidden;min-width:0;
  background:
    radial-gradient(circle at center, rgba(120,132,170,.30) 1.1px, transparent 1.2px) 0 0/24px 24px,
    linear-gradient(180deg,#F7F9FD,#EFF2FA);
}
#canvas{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#scriptLayer{position:relative;width:3200px;height:2400px;transform-origin:0 0}
.canvas-tools{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;z-index:8}
.ctool{
  width:36px;height:36px;border-radius:12px;background:#fff;box-shadow:var(--sh-2);
  display:grid;place-items:center;font-size:16px;font-weight:800;color:var(--ink-2);
  transition:transform .12s,color .15s
}
.ctool:hover{color:var(--brand);transform:translateY(-1px)}
.trash{
  position:absolute;left:14px;bottom:14px;width:50px;height:50px;border-radius:16px;background:#fff;
  box-shadow:var(--sh-2);display:grid;place-items:center;font-size:22px;z-index:8;
  transition:transform .15s, background .15s, box-shadow .15s
}
.trash:hover{transform:translateY(-2px)}
.trash.hot{transform:scale(1.22) rotate(-8deg);background:#FFE9E9;box-shadow:0 0 0 5px rgba(255,90,90,.18),var(--sh-2)}
.canvas-hint{
  position:absolute;left:50%;top:26px;transform:translateX(-50%);color:#A7AEC6;font-size:13px;font-weight:600;
  pointer-events:none;text-align:center;letter-spacing:.2px
}

/* --------- Columna escenario --------- */
.stage-col{
  width:392px;flex:0 0 392px;display:flex;flex-direction:column;min-height:0;gap:10px;overflow:hidden
}
.stage-card-main{
  background:var(--panel);border-radius:var(--r);box-shadow:var(--sh-2);overflow:hidden;
  flex:0 1 auto;min-height:0;display:flex;flex-direction:column
}
.stage-head{
  display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line-2);
  background:linear-gradient(180deg,#FFF,#FAFBFE)
}
.runbtn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  transition:background .15s, transform .12s
}
.runbtn:hover{background:var(--line-2);transform:translateY(-1px)}
#flag.glow{background:#E4F8EC;box-shadow:0 0 0 3px rgba(76,191,120,.25)}
.stage-title{font-size:12px;font-weight:700;color:var(--ink-3);margin-left:4px;letter-spacing:.3px;text-transform:uppercase}
.size-btns{margin-left:auto;display:flex;gap:2px;background:var(--line-2);padding:3px;border-radius:10px}
.size-btns button{padding:5px 9px;border-radius:8px;font-size:12px;color:var(--ink-3);font-weight:700;transition:.15s}
.size-btns button.active{background:#fff;color:var(--brand);box-shadow:var(--sh-1)}

.stage-holder{
  padding:10px;display:flex;justify-content:center;align-items:flex-start;background:#fff;
  min-height:0;flex:1 1 auto;overflow:hidden
}
#stage{
  position:relative;width:100%;max-width:min(520px, calc((100dvh - 330px) * 4 / 3));
  aspect-ratio:4/3;background:#fff;margin-inline:auto;
  border-radius:12px;overflow:hidden;touch-action:none;
  box-shadow:0 0 0 1px var(--line), inset 0 0 40px rgba(23,28,61,.035)
}
#stageBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#penLayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sprite{position:absolute;left:0;top:0;transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none}
.bubble{
  position:absolute;background:#fff;border-radius:14px;padding:7px 11px;font-size:12.5px;font-weight:600;
  color:var(--ink);max-width:190px;pointer-events:none;z-index:5;
  box-shadow:0 0 0 1px rgba(23,28,61,.10), 0 4px 12px rgba(23,28,61,.14)
}
.bubble.think{border-radius:18px}
.bubble:after{
  content:"";position:absolute;left:12px;bottom:-8px;width:0;height:0;
  border:8px solid transparent;border-top-color:#fff;border-bottom:0;
  filter:drop-shadow(0 2px 1px rgba(23,28,61,.08))
}
.var-monitor{
  position:absolute;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-radius:7px;
  font-size:11px;font-weight:700;padding:3px 5px;display:flex;align-items:center;gap:6px;z-index:6;
  box-shadow:0 0 0 1px rgba(23,28,61,.10), 0 2px 6px rgba(23,28,61,.10)
}
.var-monitor b{font-weight:700;color:var(--ink-2)}
.var-monitor span{
  background:linear-gradient(180deg,#FFA043,var(--variables));color:#fff;border-radius:5px;padding:2px 8px;
  min-width:28px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)
}
#askBox{position:absolute;left:10px;right:10px;bottom:10px;display:none;gap:8px;z-index:9}
#askBox input{
  flex:1;border:none;border-radius:22px;padding:10px 16px;font-size:13.5px;outline:none;
  box-shadow:0 0 0 1px rgba(23,28,61,.12), 0 4px 14px rgba(23,28,61,.14)
}
#askBox button{
  background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;border-radius:50%;
  width:38px;height:38px;font-size:15px;box-shadow:0 4px 12px rgba(90,75,232,.4)
}

/* Panel inferior derecho: assets + sprites */
.right-stack{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh-2);overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* Pestañas disfraces/sonidos */
.tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,#fff,#FAFBFE)}
.tab{
  padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink-3);
  transition:.15s
}
.tab:hover{background:var(--line-2);color:var(--ink-2)}
.tab.active{background:linear-gradient(180deg,#F0ECFF,#E8E2FF);color:var(--brand);box-shadow:inset 0 0 0 1px rgba(90,75,232,.16)}
#assetsPane{padding:10px;overflow:auto;flex:1;min-height:0}

.asset-row{
  display:flex;align-items:center;gap:11px;border-radius:11px;padding:8px 10px;margin-bottom:7px;
  background:#FBFCFE;box-shadow:inset 0 0 0 1px var(--line-2);transition:.15s
}
.asset-row:hover{background:#fff;box-shadow:inset 0 0 0 1px #D6DCEE, var(--sh-1)}
.asset-row .thumbbox{
  width:46px;height:46px;flex:0 0 46px;border-radius:10px;background:#fff;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px var(--line-2);font-size:22px
}
.asset-row img{width:38px;height:38px;object-fit:contain}
.asset-row .nm{font-weight:700;font-size:13px;color:var(--ink)}
.asset-row .sub{font-size:11px;color:var(--ink-3);margin-top:1px}
.asset-row .acts{margin-left:auto;display:flex;gap:5px}
.minibtn{
  background:var(--line-2);color:var(--ink-2);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;
  transition:.15s;white-space:nowrap
}
.minibtn:hover{background:#E2E7F5;color:var(--ink)}
.minibtn.accent{background:linear-gradient(180deg,#EFEBFF,#E6E0FF);color:var(--brand)}
.minibtn.accent:hover{background:#E2DAFF}
.minibtn.red{background:#FFEDED;color:#E05555}
.minibtn.red:hover{background:#FFDFDF}
.bigadd{
  display:block;width:100%;padding:13px;margin-top:8px;border-radius:12px;font-weight:700;font-size:13px;
  color:var(--brand);background:#fff;box-shadow:inset 0 0 0 2px #E4DEFF;transition:.15s
}
.bigadd:hover{background:#F7F5FF;box-shadow:inset 0 0 0 2px #CFC4FF}

/* Lista de objetos */
.sprite-panel{display:flex;min-height:0;flex:1 1 auto;overflow:hidden}
.sprite-list-wrap{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.sp-info{display:flex;flex-wrap:wrap;gap:7px;padding:9px 10px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,#fff,#FAFBFE)}
.sp-field{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink-3)}
.sp-field input{
  width:56px;border:none;border-radius:9px;padding:6px 8px;font-size:11.5px;font-weight:600;text-align:center;
  color:var(--ink);background:#F3F5FB;outline:none;box-shadow:inset 0 0 0 1px var(--line);transition:.15s
}
.sp-field input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
.sp-field input.name{width:104px;text-align:left}
#fShow{padding:6px 9px;border-radius:9px;background:#F3F5FB;box-shadow:inset 0 0 0 1px var(--line)}

.sprite-list{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px 10px 66px}
.sp-card{
  width:72px;height:80px;background:#fff;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;position:relative;font-size:10.5px;font-weight:700;
  color:var(--ink-2);padding:4px;box-shadow:inset 0 0 0 1px var(--line-2);transition:.15s
}
.sp-card:hover{box-shadow:inset 0 0 0 1px #CDD5EA, var(--sh-1);transform:translateY(-1px)}
.sp-card.sel{
  box-shadow:inset 0 0 0 2px var(--accent), 0 4px 12px rgba(76,151,255,.22);
  background:linear-gradient(180deg,#F5F9FF,#EAF2FF);color:var(--accent)
}
.sp-card img{width:40px;height:40px;object-fit:contain;pointer-events:none}
.sp-card .del{
  position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  background:linear-gradient(180deg,#FF7373,#F04A4A);color:#fff;font-size:12px;display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(240,74,74,.5);opacity:0;transition:.15s
}
.sp-card:hover .del,.sp-card.sel .del{opacity:1}
.stage-card{
  width:96px;flex:0 0 96px;border-left:1px solid var(--line-2);background:#FBFCFE;padding:10px 8px;
  text-align:center;font-size:11px;font-weight:700;color:var(--ink-3);
  min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;
  display:flex;flex-direction:column;gap:6px
}
.stage-card .thumb{width:100%;aspect-ratio:4/3;border-radius:8px;object-fit:cover;margin-bottom:6px;box-shadow:inset 0 0 0 1px var(--line)}
.addbtn{
  position:absolute;right:12px;bottom:12px;flex:0 0 auto;width:50px;height:50px;border-radius:17px;
  background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;font-size:22px;
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(90,75,232,.42);z-index:12;transition:.15s
}
.addbtn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 24px rgba(90,75,232,.5)}

/* ===================== BLOQUES ===================== */
.block{
  position:relative;display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;
  padding:9px 13px;border-radius:5px;color:#fff;font-weight:700;font-size:13px;line-height:1.2;
  min-height:38px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  text-shadow:0 1px 1px rgba(0,0,0,.14);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(0,0,0,.16),
    0 1px 2px rgba(23,28,61,.16);
  background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.05));
  transition:filter .12s;
}
.block:active{cursor:grabbing}
.palette .block:hover{filter:brightness(1.06)}
.palette .blockrow{transform-origin:left center;transform:scale(.94)}
.palette .bfield.text{min-width:48px}

/* muesca superior (hueco) y pestaña inferior (encaje) */
.block:before{
  content:"";position:absolute;left:14px;top:0;width:20px;height:5px;
  border-radius:0 0 6px 6px;background:rgba(0,0,0,.14);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)
}
.block:after{
  content:"";position:absolute;left:14px;bottom:-5px;width:20px;height:5px;
  border-radius:0 0 6px 6px;background:inherit;background-color:inherit;z-index:2;
  box-shadow:0 1px 1px rgba(23,28,61,.13)
}
.block.hat{border-radius:19px 19px 5px 5px;padding-top:15px}
.block.hat:before{display:none}
.block.cap{border-radius:5px 5px 5px 5px}
.block.cap:after{display:none}
.block.reporter,.block.boolean{min-height:28px;padding:5px 13px;font-size:12.5px}
.block.reporter{border-radius:16px}
.block.boolean{border-radius:4px;padding:5px 15px;clip-path:polygon(11px 0,100% 0,calc(100% - 11px) 100%,0 100%)}
.block.reporter:before,.block.reporter:after,.block.boolean:before,.block.boolean:after{display:none}

.block[data-cat=motion]{background-color:var(--motion)}
.block[data-cat=looks]{background-color:var(--looks)}
.block[data-cat=sound]{background-color:var(--sound)}
.block[data-cat=events]{background-color:var(--events)}
.block[data-cat=control]{background-color:var(--control)}
.block[data-cat=sensing]{background-color:var(--sensing)}
.block[data-cat=operators]{background-color:var(--operators)}
.block[data-cat=variables]{background-color:var(--variables)}
.block[data-cat=myblocks]{background-color:var(--myblocks)}
.block.glow{box-shadow:0 0 0 3px #FFDE3A, inset 0 1px 0 rgba(255,255,255,.28), 0 2px 8px rgba(0,0,0,.2)}

/* Campos */
.bfield{
  background:#fff;border:none;border-radius:14px;padding:3px 9px;min-width:30px;text-align:center;
  color:var(--ink);font-weight:700;font-size:12px;outline:none;text-shadow:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.10), 0 1px 1px rgba(0,0,0,.08) inset;
  transition:box-shadow .12s
}
.bfield:focus{box-shadow:0 0 0 2px rgba(255,255,255,.85), inset 0 0 0 1px rgba(0,0,0,.1)}
.bfield.text{border-radius:13px;min-width:58px;text-align:left}
select.bfield{
  border-radius:13px;padding:4px 6px;background:rgba(0,0,0,.16);color:#fff;font-weight:700;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);appearance:none;padding-right:20px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 7px center
}
select.bfield option{color:var(--ink);background:#fff}
.bslot{
  min-width:36px;min-height:26px;border-radius:14px;background:rgba(0,0,0,.16);
  display:inline-flex;align-items:center;justify-content:center;padding:1px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.18)
}
.bslot.bool{border-radius:4px;min-width:40px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.bslot.filled{background:transparent;padding:0;box-shadow:none}
.colorfield{
  width:26px;height:22px;border-radius:6px;border:2px solid #fff;padding:0;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.25)
}

/* Pilas y bloques C */
.stack{position:absolute;display:flex;flex-direction:column;align-items:flex-start}
/* salvaguarda: un .block nunca debe posicionarse en absoluto aunque herede otra clase */
.block.stack,.blockrow .block{position:relative}
.stack.dragging{opacity:.92;z-index:500;filter:drop-shadow(0 10px 22px rgba(23,28,61,.35)) brightness(1.03);pointer-events:none}
.blockrow{display:flex;flex-direction:column;align-items:flex-start;width:max-content}
.cbody{
  display:flex;flex-direction:column;align-items:flex-start;margin-left:16px;min-height:24px;min-width:70px;
  padding:5px 0;border-left:16px solid;position:relative;
  box-shadow:inset 1px 0 0 rgba(255,255,255,.18)
}
.cbody[data-cat=control]{border-color:var(--control)}
.cbody[data-cat=myblocks]{border-color:var(--myblocks)}
.cbody.empty:after{content:"";display:block;height:16px}
.cfoot{
  height:16px;border-radius:0 0 5px 5px;width:78px;position:relative;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.16), 0 1px 2px rgba(23,28,61,.14);
  background-image:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.05))
}
.cfoot[data-cat=control]{background-color:var(--control)}
.cfoot[data-cat=myblocks]{background-color:var(--myblocks)}
.cfoot:after{
  content:"";position:absolute;left:14px;bottom:-5px;width:20px;height:5px;
  border-radius:0 0 6px 6px;background:inherit;background-color:inherit
}
.dropline{
  height:7px;background:linear-gradient(90deg,#FFE773,#FFCE1F);border-radius:4px;margin:2px 0;
  box-shadow:0 0 0 2px rgba(255,222,58,.35), 0 2px 8px rgba(255,190,20,.6);
  animation:pulse .9s ease-in-out infinite
}
@keyframes pulse{50%{opacity:.7}}

/* ===================== MODALES ===================== */
.modal-bg{
  position:fixed;inset:0;background:rgba(26,30,56,.55);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:300;padding:18px;
  animation:fade .18s ease
}
@keyframes fade{from{opacity:0}}
.modal-bg.open{display:flex}
.modal{
  background:#fff;border-radius:20px;max-width:880px;width:100%;max-height:88dvh;display:flex;flex-direction:column;
  overflow:hidden;box-shadow:var(--sh-3);animation:pop .22s cubic-bezier(.2,1.1,.4,1)
}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
.modal header{
  background:linear-gradient(135deg,#5A4BE8,#7B5CF0 60%,#4C97FF);color:#fff;padding:16px 20px;
  font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px
}
.modal header .x{margin-left:auto;font-size:19px;color:#fff;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.16)}
.modal header .x:hover{background:rgba(255,255,255,.3)}
.modal .body{padding:18px 20px 22px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
.pick{
  border-radius:14px;padding:12px 6px;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-2);
  background:#FBFCFE;box-shadow:inset 0 0 0 1px var(--line-2);transition:.15s
}
.pick:hover{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 2px #CFC4FF, var(--sh-2);transform:translateY(-2px)}
.pick img{width:62px;height:62px;object-fit:contain;margin-bottom:4px}
.pick .sn{font-size:30px;margin-bottom:4px}
.example-card{
  display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border-radius:14px;
  background:#FBFCFE;box-shadow:inset 0 0 0 1px var(--line-2);transition:.15s
}
.example-card:hover{background:#fff;box-shadow:inset 0 0 0 2px #CFC4FF, var(--sh-2);transform:translateY(-2px)}
.example-card b{font-size:15.5px;color:var(--ink);display:block;margin-bottom:4px}
.example-card span{font-size:12.5px;color:var(--ink-3)}

/* ===================== TUTORIAL ===================== */
#tutorial{
  position:fixed;right:18px;bottom:18px;width:356px;max-width:calc(100vw - 28px);background:#fff;
  border-radius:18px;box-shadow:var(--sh-3);z-index:200;display:none;flex-direction:column;overflow:hidden;
  animation:pop .22s cubic-bezier(.2,1.1,.4,1)
}
#tutorial.open{display:flex}
#tutorial header{
  background:linear-gradient(135deg,#5A4BE8,#8C6BFF);color:#fff;padding:13px 16px;font-weight:800;font-size:14.5px;
  display:flex;align-items:center;gap:9px
}
#tutorial header .x{margin-left:auto;color:#fff;font-size:17px;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.18)}
#tutStep{padding:16px 18px;font-size:13.5px;line-height:1.6;max-height:46dvh;overflow:auto;color:var(--ink-2)}
#tutStep h4{margin:0 0 10px;font-size:16.5px;color:var(--ink);font-weight:800;letter-spacing:-.2px}
#tutStep b{color:var(--ink)}
#tutStep code{background:#F1F3FA;border-radius:5px;padding:2px 6px;font-size:12px;font-family:"SF Mono",Menlo,monospace;color:var(--brand)}
#tutStep .demo{
  display:inline-block;color:#fff;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:700;margin:3px 3px 3px 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 1px 2px rgba(23,28,61,.2);text-shadow:0 1px 1px rgba(0,0,0,.15)
}
#tutFoot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line-2);background:#FBFCFE}
#tutFoot .prog{font-size:12px;font-weight:700;color:var(--ink-3)}
#tutFoot button{
  background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;border-radius:11px;padding:9px 16px;
  font-weight:700;font-size:13px;box-shadow:0 3px 10px rgba(90,75,232,.32);transition:.15s
}
#tutFoot button:hover{transform:translateY(-1px)}
#tutFoot button.ghost{background:var(--line-2);color:var(--ink-2);box-shadow:none;padding:9px 13px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:30px;
  background:rgba(30,34,62,.95);backdrop-filter:blur(8px);color:#fff;padding:12px 22px;border-radius:14px;
  font-size:13.5px;font-weight:600;z-index:500;opacity:0;transition:.28s cubic-bezier(.2,1,.4,1);pointer-events:none;
  box-shadow:var(--sh-3)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Constructor de criatura ---------- */
function creature(p, spName, variant) {
  const sp = SPECIES[spName], open = variant === 1;
  const rx = sp.wide ? 37 : 34, ry = sp.small ? 28 : 31;
  let s = piso(111, 29);
  s += sp.back(p);
  s += `<rect x="42" y="74" width="36" height="30" rx="14" fill="url(#b)" stroke="${p[3]}" stroke-width="2.5"/>`;
  s += open
    ? `<rect x="38" y="96" width="15" height="12" rx="6" fill="${p[2]}" stroke="${p[3]}" stroke-width="2" transform="rotate(-18 45 102)"/><rect x="67" y="96" width="15" height="12" rx="6" fill="${p[2]}" stroke="${p[3]}" stroke-width="2" transform="rotate(18 75 102)"/>`
    : `<rect x="45" y="97" width="13" height="11" rx="5.5" fill="${p[2]}" stroke="${p[3]}" stroke-width="2"/><rect x="62" y="97" width="13" height="11" rx="5.5" fill="${p[2]}" stroke="${p[3]}" stroke-width="2"/>`;
  s += `<ellipse cx="60" cy="52" rx="${rx}" ry="${ry}" fill="url(#b)" stroke="${p[3]}" stroke-width="2.5"/>`;
  if (sp.patch) s += `<circle cx="42" cy="50" r="13" fill="#3D4358"/><circle cx="78" cy="50" r="13" fill="#3D4358"/>`;
  if (sp.belly) s += `<ellipse cx="60" cy="60" rx="24" ry="24" fill="#FFF8F0"/>`;
  s += `<ellipse cx="60" cy="40" rx="${rx - 8}" ry="15" fill="url(#gloss)"/>`;
  if (!sp.noeyes) {
    const er = sp.bigeyes ? 12 : 8.5, ey = sp.bigeyes ? 50 : 50, sep = sp.bigeyes ? 17 : 15;
    if (sp.bigeyes) s += `<circle cx="${60 - sep}" cy="${ey}" r="${er + 2}" fill="#FFF8F0"/><circle cx="${60 + sep}" cy="${ey}" r="${er + 2}" fill="#FFF8F0"/>`;
    s += eyes(ey, sep, er, open ? 2 : 0);
  }
  if (sp.snout) s += `<ellipse cx="60" cy="67" rx="${sp.snout === 2 ? 13 : 15}" ry="${sp.snout === 2 ? 10 : 11}" fill="#F8EDE0"/>`;
  if (sp.snout === 2) s += `<circle cx="55" cy="66" r="2.6" fill="#B2536F"/><circle cx="65" cy="66" r="2.6" fill="#B2536F"/>`;
  if (sp.beak) s += `<path d="M53 62 h14 l-7 9z" fill="#FFB020" stroke="#E08A00" stroke-width="1.5" stroke-linejoin="round"/>`;
  else if (sp.nose) s += `<path d="M54 61 h12 l-6 6z" fill="${sp.nose}" stroke="${sp.nose}" stroke-width="1.2" stroke-linejoin="round"/>`;
  if (sp.teeth) s += `<path d="M44 68 h32 v8 q-16 10 -32 0z" fill="#8E3B33"/><path d="M48 68 l4 7 4-7z M64 68 l4 7 4-7z" fill="#fff"/>`;
  else if (open) s += `<ellipse cx="60" cy="72" rx="8" ry="9" fill="#8E3B33"/><ellipse cx="60" cy="75" rx="5" ry="5" fill="#FF8FA0"/>`;
  else s += smile(sp.snout ? 71 : 68, 13, 9);
  if (sp.whisk) s += `<g stroke="${p[3]}" stroke-width="2.2" stroke-linecap="round" opacity=".85"><path d="M24 58 H6 M24 65 H9 M96 58 h18 M96 65 h15"/></g>`;
  s += blush(66, .3);
  return W(s, grad('b', p));
}

  const ey = variant ? `<rect x="45" y="44" width="12" height="5" rx="2.5" fill="#4CE0B3"/><rect x="63" y="44" width="12" height="5" rx="2.5" fill="#4CE0B3"/>`

   <rect x="57.5" y="10" width="5" height="14" rx="2.5" fill="${p[3]}"/><circle cx="60" cy="9" r="5.5" fill="#FF6B6B"/>

   <rect x="47" y="82" width="26" height="14" rx="4" fill="#4A576D" opacity=".4"/>
   <rect x="29" y="24" width="62" height="48" rx="${r}" fill="url(#b)" stroke="${p[3]}" stroke-width="2.5"/>

/* ======================= CATÁLOGO ======================= */
function entry(name, emoji, tags, gen, cat, sub) {
  const e = { name, emoji, tags, gen, cat: cat || tags[0], sub: sub || '' };
  Object.defineProperty(e, 'costumes', { get() { return this._c || (this._c = this.gen()); }, configurable: true });
  return e;
}

const HERO_CAT = { 'Gatito': ['animales','Gato'], 'Perrito': ['animales','Perro'], 'Robot': ['robots','Robot clásico'],
  'Dino': ['fantasia','Dino'], 'Pelota': ['objetos','Pelota'], 'Nave': ['vehiculos','Cohete'],
  'Estrella': ['formas','Estrella'], 'Maga': ['personas','Maga'], 'Fantasma': ['fantasia','Fantasma'],
  'Manzana': ['comida','Manzana'], 'Coche': ['vehiculos','Coche'], 'Corazón': ['formas','Corazón'] };

function buildLibrary() {
  const out = HERO_LIBRARY.map(h => {
    const c = HERO_CAT[h.name] || ['objetos', h.name];
    return Object.assign(h, { cat: c[0], sub: c[1], destacado: true, tags: (h.tags || []).concat([c[0]]) });
  });
  const seen = new Set(out.map(o => o.name));
  const push = e => { if (!seen.has(e.name)) { seen.add(e.name); out.push(e); } };

  // 1) Criaturas: 16 especies × 18 colores = 288 (×2 disfraces)
  for (const sp in SPECIES)
    for (const p of PAL)
      push(entry(`${sp} ${p[0]}`, '', ['animales', sp.toLowerCase(), p[0].toLowerCase()],
        (() => { const _p = p, _s = sp; return () => [{ name: 'normal', src: creature(_p, _s, 0) }, { name: 'acción', src: creature(_p, _s, 1) }]; })(),
        FANTASY.includes(sp) ? 'fantasia' : 'animales', sp));

  // 2) Robots: 4 formas × 18 colores = 72
  for (let sh = 0; sh < 4; sh++)
    for (const p of PAL)
      push(entry(`Robot ${['clásico', 'cuadrado', 'redondo', 'mini'][sh]} ${p[0]}`, '', ['robots', p[0].toLowerCase()],
        (() => { const _p = p, _sh = sh; return () => [{ name: 'normal', src: robot(_p, _sh, 0) }, { name: 'acción', src: robot(_p, _sh, 1) }]; })(),
        'robots', 'Robot ' + ['clásico', 'cuadrado', 'redondo', 'mini'][sh]));

  // 3) Formas: 16 × 18 = 288
  for (const sn in SHAPES)
    for (const p of PAL)
      push(entry(`${sn} ${p[0]}`, '', ['formas', sn.toLowerCase(), p[0].toLowerCase()],
        (() => {
          const _p = p, _d = SHAPES[sn];
          return () => [
            { name: 'lisa', src: W(_d.replace(/url\(#b\)/g, 'url(#b)'), grad('b', _p)) },
            { name: 'contorno', src: W(`<g stroke="${_p[3]}" stroke-width="4">${_d}</g>`, grad('b', _p)) }
          ];
        })(), 'formas', sn));

  // 4) Comida: 12 × 8 colores = 96
  const fpal = PAL.filter(p => !['Blanco', 'Negro', 'Gris'].includes(p[0])).slice(0, 8);
  for (const fn in FOODS)
    for (const p of fpal)
      push(entry(`${fn} ${p[0]}`, '', ['comida', fn.toLowerCase()],
        (() => { const _p = p, _f = FOODS[fn]; return () => [{ name: 'normal', src: W(piso(112, 26) + _f(_p), grad('b', _p)) }]; })(), 'comida', fn));

  // 5) Vehículos: 8 × 12 = 96
  for (const vn in VEHICLES)
    for (const p of PAL.slice(0, 12))
      push(entry(`${vn} ${p[0]}`, '', ['vehiculos', vn.toLowerCase()],
        (() => { const _p = p, _v = VEHICLES[vn]; return () => [{ name: 'normal', src: W(_v(_p), grad('b', _p)) }]; })(), 'vehiculos', vn));

  // 6) Pelotas/globos: 4 × 18 = 72
  for (const bn in BALLS)
    for (const p of PAL)
      push(entry(`${bn} ${p[0]}`, '', ['objetos', bn.toLowerCase()],
        (() => { const _p = p, _b = BALLS[bn]; return () => [{ name: 'normal', src: W(_b(_p), grad('b', _p)) }]; })(), 'objetos', bn));

  // 7) Letras y números: 36 × 5 estilos = 180
  const CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
  const STY = [
    ['bloque', (c, p) => W(`<rect x="12" y="12" width="96" height="96" rx="18" fill="url(#b)"/><text x="60" y="60" font-family="Arial,Helvetica" font-size="66" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">${c}</text>`, grad('b', p))],
    ['redonda', (c, p) => W(`<circle cx="60" cy="60" r="48" fill="url(#b)"/><text x="60" y="60" font-family="Arial,Helvetica" font-size="62" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">${c}</text>`, grad('b', p))],
    ['contorno', (c, p) => W(`<text x="60" y="60" font-family="Arial,Helvetica" font-size="88" font-weight="bold" fill="url(#b)" stroke="${p[3]}" stroke-width="3" text-anchor="middle" dominant-baseline="central">${c}</text>`, grad('b', p))],
    ['globo', (c, p) => W(`<text x="60" y="62" font-family="Arial,Helvetica" font-size="92" font-weight="bold" fill="url(#b)" stroke="#fff" stroke-width="6" paint-order="stroke" text-anchor="middle" dominant-baseline="central">${c}</text>`, grad('b', p))],
    ['sombra', (c, p) => W(`<text x="64" y="64" font-family="Arial,Helvetica" font-size="88" font-weight="bold" fill="${p[3]}" opacity=".5" text-anchor="middle" dominant-baseline="central">${c}</text><text x="60" y="60" font-family="Arial,Helvetica" font-size="88" font-weight="bold" fill="url(#b)" text-anchor="middle" dominant-baseline="central">${c}</text>`, grad('b', p))]
  ];
  CH.forEach(c => STY.forEach(([sn, fn], i) => {
    const p = PAL[(CH.indexOf(c) + i * 3) % PAL.length];
    push(entry(`${/[0-9]/.test(c) ? 'Número' : 'Letra'} ${c} ${sn}`, '', ['letras', sn],
      (() => { const _c = c, _p = p, _f = fn; return () => [{ name: _c, src: _f(_c, _p) }]; })(),
      'letras', /[0-9]/.test(c) ? 'Números' : 'Letras'));
  }));

  return out;
}

  else s += `<circle cx="392" cy="70" r="34" fill="#FFF0A8" opacity=".95"/><circle cx="392" cy="70" r="52" fill="#FFF0A8" opacity=".22"/>`;

  if (deco === 'edificios') s += `<g fill="#3F4C63"><rect x="56" y="156" width="74" height="106" rx="4"/><rect x="148" y="104" width="88" height="158" rx="4"/><rect x="254" y="176" width="66" height="86" rx="4"/><rect x="334" y="136" width="80" height="126" rx="4"/></g><g fill="#FFE07A" opacity=".9">${Array.from({ length: 18 }, (_, i) => `<rect x="${68 + (i % 6) * 58}" y="${castY(i)}" width="12" height="15" rx="2"/>`).join('')}</g>`;
  if (deco === 'cactus') s += `<g fill="#3E9142"><rect x="90" y="190" width="20" height="72" rx="10"/><rect x="66" y="212" width="26" height="14" rx="7"/><rect x="108" y="200" width="26" height="14" rx="7"/><rect x="350" y="206" width="16" height="56" rx="8"/></g>`;
  if (deco === 'burbujas') s += `<g fill="#fff" opacity=".35">${Array.from({ length: 12 }, (_, i) => `<circle cx="${(i * 71 + 40) % 460}" cy="${290 - (i * 43) % 120}" r="${4 + (i % 4) * 3}"/>`).join('')}</g>`;
  s += `<path d="M0 258 q80 -22 160 0 t160 0 t160 0 v102 H0z" fill="${g[0]}"/>`;
  s += `<path d="M0 290 q80 -18 160 0 t160 0 t160 0 v70 H0z" fill="${g[1]}"/>`;
  return BD2(s, `<linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${sky[1]}"/><stop offset="60%" stop-color="${sky[2]}"/><stop offset="100%" stop-color="${sky[3]}"/></linearGradient>`);
}

function buildBackdrops() {
  const out = HERO_BACKDROPS.map(b => Object.assign(b, { cat: 'clasicos', sub: 'Clásicos', tags: ['clasicos'], destacado: true }));
  const seen = new Set(out.map(b => b.name));
  const add = (name, fn, tags = [], cat = 'clasicos', sub = '') => {
    if (seen.has(name)) return; seen.add(name);
    const o = { name, gen: fn, tags, cat, sub };
    Object.defineProperty(o, 'src', { get() { return this._s || (this._s = this.gen()); }, configurable: true });
    out.push(o);
  };
  // escenas: 12 cielos × 8 suelos = 96 (decorado según el suelo)
  const DEC = { 'Pradera': 'árboles', 'Desierto': 'cactus', 'Nieve': 'montañas', 'Roca': 'montañas', 'Lava': 'nubes', 'Agua': 'burbujas', 'Ciudad': 'edificios', 'Arena': 'nubes' };
  SKY.forEach(sk => Object.keys(GROUND).forEach(gn =>
    add(`${gn} · ${sk[0]}`, () => sceneBD(sk, gn, DEC[gn]), ['escenas', gn.toLowerCase(), sk[0].toLowerCase()], 'escenas', gn)));
  // patrones: 10 × 18 colores = 180
  Object.keys(PATTERNS).forEach(pn => PAL.forEach(p =>
    add(`${pn} ${p[0]}`, () => BD2(PATTERNS[pn](p[2], p[1]),
      `<linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[1]}"/><stop offset="100%" stop-color="${p[3]}"/></linearGradient>`),
      ['patrones', pn.toLowerCase()], 'patrones', pn)));
  return out;
}

function subsOf(list, cat) {
  const m = new Map();
  list.forEach(i => { if ((!cat || i.cat === cat) && i.sub && !m.has(i.sub)) m.set(i.sub, i); });

/* ================== BLOQUES: modelo ================== */
function nuevoBloque(op) {
  const def = BLOCKS[op];
  const b = { id: uid(), op, fields: {}, inputs: {} };
  const walk = spec => spec.forEach(p => {
    if (p.t === 'num' || p.t === 'text') b.fields[p.k] = p.d;
    if (p.t === 'menu') b.fields[p.k] = resolveMenu(p)[0] ?? p.d;
    if (p.t === 'color') b.fields[p.k] = p.d;
    if (p.t === 'slot') b.inputs[p.k] = p.d;
    if (p.t === 'bool') b.inputs[p.k] = null;
  });
  walk(def.spec); if (def.spec2) walk(def.spec2);
  if (def.shape === 'c' || def.shape === 'c2') b.children = [];
  if (def.shape === 'c2') b.children2 = [];
  return b;
}

function resolveMenu(p) {
  let out = [];
  for (const o of p.opts) {
    if (o === '@disfraces') out.push(...(sel ? sel.costumes.map(c => c.name) : []));
    else if (o === '@fondos') out.push(...P.backdrops.map(b => b.name));
    else if (o === '@sonidos') out.push(...(sel ? sel.sounds.map(s => s.name) : []));
    else if (o === '@objetos') out.push(...P.sprites.filter(s => s !== sel).map(s => s.name));
    else if (o === '@vars') out.push(...Object.keys(P.vars));
    else if (o === '@listas') out.push(...Object.keys(P.lists));
    else out.push(o);
  }
  if (!out.length) out = ['—'];
  return out;
}

/* ================== BLOQUES: render DOM ================== */
function renderBlock(b, opts = {}) {
  const def = BLOCKS[b.op];
  const wrap = document.createElement('div');
  wrap.className = 'blockrow';
  wrap.dataset.bid = b.id;

  const el = document.createElement('div');
  el.className = 'block';           // ¡ojo! nunca añadir def.shape como clase: 'stack' colisiona con .stack{position:absolute}
  if (def.shape === 'hat') el.classList.add('hat');
  if (def.shape === 'cap') el.classList.add('cap');
  if (def.shape === 'reporter') el.classList.add('reporter');
  if (def.shape === 'boolean') el.classList.add('boolean');
  el.dataset.cat = def.cat; el.dataset.bid = b.id;
  el.append(...renderSpec(b, def.spec, opts));
  wrap.append(el);

  if (def.shape === 'c' || def.shape === 'c2') {
    wrap.append(mkBody(b, 'children', def.cat, opts));
    if (def.shape === 'c2') {
      const el2 = document.createElement('div');
      el2.className = 'block'; el2.dataset.cat = def.cat; el2.dataset.bid = b.id; el2.dataset.part = '2';
      el2.append(...renderSpec(b, def.spec2, opts));
      wrap.append(el2, mkBody(b, 'children2', def.cat, opts));
    }
    const foot = document.createElement('div');
    foot.className = 'cfoot'; foot.dataset.cat = def.cat;
    if (!def.cap) wrap.append(foot); else { foot.style.borderRadius = '0 0 14px 14px'; wrap.append(foot); }
  }
  return wrap;
}

function mkBody(b, key, cat, opts) {
  const body = document.createElement('div');
  body.className = 'cbody' + ((b[key] || []).length ? '' : ' empty');
  body.dataset.cat = cat; body.dataset.body = key; body.dataset.owner = b.id;
  (b[key] || []).forEach(ch => body.append(renderBlock(ch, opts)));
  return body;
}

function renderSpec(b, spec, opts) {
  const nodes = [];
  for (const p of spec) {
    if (p.t === 'label') {
      const s = document.createElement('span');
      if (p.v.includes('@')) {
        // "girar @rot-cw" -> texto + icono CSS
        s.innerHTML = p.v.replace(/@([a-z-]+)/g, '<span class="ic ic-$1 blk-ic"></span>');
      } else s.textContent = p.v;
      nodes.push(s);
    }
    else if (p.t === 'num' || p.t === 'text') {
      const i = document.createElement('input');
      i.className = 'bfield' + (p.t === 'text' ? ' text' : '');
      i.value = b.fields[p.k]; i.size = Math.max(2, String(b.fields[p.k]).length);
      if (p.t === 'num') i.inputMode = 'decimal';
      i.oninput = () => { b.fields[p.k] = i.value; i.size = Math.max(2, i.value.length); };
      i.onpointerdown = e => e.stopPropagation();
      nodes.push(i);
    }
    else if (p.t === 'menu') {
      const s = document.createElement('select'); s.className = 'bfield';
      const list = resolveMenu(p);
      if (b.fields[p.k] && !list.includes(b.fields[p.k])) list.unshift(b.fields[p.k]);
      list.forEach(o => { const op = document.createElement('option'); op.value = op.textContent = o; s.append(op); });
      s.value = b.fields[p.k] ?? list[0];
      s.onchange = () => b.fields[p.k] = s.value;
      s.onpointerdown = e => e.stopPropagation();
      nodes.push(s);
    }
    else if (p.t === 'color') {
      const i = document.createElement('input'); i.type = 'color'; i.className = 'colorfield';
      i.value = b.fields[p.k]; i.oninput = () => b.fields[p.k] = i.value;
      i.onpointerdown = e => e.stopPropagation(); nodes.push(i);
    }
    else if (p.t === 'slot' || p.t === 'bool') {
      const slot = document.createElement('div');
      slot.className = 'bslot' + (p.t === 'bool' ? ' bool' : '');
      slot.dataset.slot = p.k; slot.dataset.owner = b.id; slot.dataset.kind = p.t;
      const val = b.inputs[p.k];
      if (val && typeof val === 'object') { slot.classList.add('filled'); slot.append(renderBlock(val, opts)); }
      else if (p.t === 'slot') {
        const i = document.createElement('input'); i.className = 'bfield';
        i.value = val ?? ''; i.size = Math.max(2, String(val ?? '').length);
        i.oninput = () => { b.inputs[p.k] = i.value; i.size = Math.max(2, i.value.length); };
        i.onpointerdown = e => e.stopPropagation();
        slot.classList.add('filled'); slot.append(i);
      }
      nodes.push(slot);
    }
  }
  return nodes;
}

const layer = () => $('#scriptLayer');

function renderScripts() {
  const lay = layer(); lay.innerHTML = '';
  const hint = document.querySelector('#canvasHint');
  if (hint) hint.style.display = scripts().length ? 'none' : 'block';
  const bc = document.querySelector('#blkCount');
  if (bc) { const n = scripts().reduce((a, s) => a + s.blocks.length, 0); bc.textContent = n ? `(${n})` : ''; }
  scripts().forEach(st => {
    const d = document.createElement('div');
    d.className = 'stack'; d.style.left = st.x + 'px'; d.style.top = st.y + 'px';
    d.dataset.sid = st.id;
    st.blocks.forEach(b => d.append(renderBlock(b)));
    lay.append(d);
  });
}

function findStack(id) { return scripts().find(s => s.id === id); }

/* --- localizar un bloque y su contenedor --- */
function locate(bid, arr = null, parent = null) {
  const roots = arr || scripts().map(s => s.blocks);
  for (const list of (arr ? [arr] : scripts().map(s => s.blocks))) {
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (b.id === bid) return { list, i, b };
      for (const k of ['children', 'children2']) if (b[k]) { const r = locate(bid, b[k]); if (r) return r; }
      for (const k in b.inputs) { const v = b.inputs[k]; if (v && typeof v === 'object') { if (v.id === bid) return { input: b, key: k, b: v }; const r = locate(bid, [v]); if (r) return r; } }
    }
  }
  return null;
}

/* ================== Arrastre ================== */
const isMobile = () => window.innerWidth <= 900;
function nextFreeY() {
  const ss = scripts(); if (!ss.length) return 40;
  return Math.max(...ss.map(s => s.y)) + 120;
}
let drag = null;

function onPointerDown(e) {
  const blockEl = e.target.closest('.block');
  if (!blockEl) return;
  if (e.target.closest('input,select')) return;
  const fromPalette = !!e.target.closest('#palette');
  const bid = blockEl.dataset.bid;
  e.preventDefault();

  let stackBlocks, origin;
  const canvasRect = $('#canvas').getBoundingClientRect();

  if (fromPalette) {
    const op = blockEl.dataset.op;
    stackBlocks = [nuevoBloque(op)];
    origin = { x: e.clientX, y: e.clientY };
  } else {
    const loc = locate(bid);
    if (!loc) return;
    if (loc.input) { const b = loc.b; loc.input.inputs[loc.key] = ''; stackBlocks = [b]; }
    else { stackBlocks = loc.list.splice(loc.i); }
    origin = { x: e.clientX, y: e.clientY };
  }

  const ghost = document.createElement('div');
  ghost.className = 'stack dragging';
  stackBlocks.forEach(b => ghost.append(renderBlock(b)));
  document.body.append(ghost);
  ghost.style.position = 'fixed';
  const r = blockEl.getBoundingClientRect();
  const off = { x: e.clientX - r.left, y: e.clientY - r.top };
  ghost.style.left = (e.clientX - off.x) + 'px';
  ghost.style.top = (e.clientY - off.y) + 'px';

  drag = { ghost, blocks: stackBlocks, off, fromPalette };
  renderScripts(); renderStage();
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp, { once: true });
}

function onPointerMove(e) {
  if (!drag) return;
  drag.ghost.style.left = (e.clientX - drag.off.x) + 'px';
  drag.ghost.style.top = (e.clientY - drag.off.y) + 'px';
  highlightTarget(e);
  const t = $('#trash').getBoundingClientRect();
  const over = e.clientX > t.left - 10 && e.clientX < t.right + 10 && e.clientY > t.top - 10 && e.clientY < t.bottom + 10;
  $('#trash').classList.toggle('hot', over);
}

let dropHint = null;
function clearHint() { if (dropHint) { dropHint.el?.remove(); dropHint = null; } }

function highlightTarget(e) {
  clearHint();
  const first = drag.blocks[0], def = BLOCKS[first.op];
  const px = e.clientX - drag.off.x + 10, py = e.clientY - drag.off.y + 10;

  if (def.shape === 'reporter' || def.shape === 'boolean') {
    const slots = $$('#scriptLayer .bslot').filter(s => def.shape === 'boolean' ? true : s.dataset.kind === 'slot');
    let best = null, bd = 60;
    slots.forEach(s => {
      if (s.closest('.stack.dragging')) return;
      if (def.shape === 'reporter' && s.dataset.kind === 'bool') return;
      const r = s.getBoundingClientRect();
      const d = Math.hypot(r.left + r.width / 2 - px, r.top + r.height / 2 - py);
      if (d < bd) { bd = d; best = s; }
    });
    if (best) { best.style.outline = '3px solid #ffde3a'; dropHint = { slot: best, el: null, clear: () => best.style.outline = '' }; }
    return;
  }
  if (def.shape === 'hat') return; // sombreros van sueltos
  // buscar punto de conexión de pila
  let best = null, bd = 70;
  $$('#scriptLayer .blockrow').forEach(row => {
    if (row.closest('.stack.dragging')) return;
    const rb = BLOCKS[findAnyBlock(row.dataset.bid)?.op];
    if (!rb) return;
    const r = row.getBoundingClientRect();
    const d = Math.hypot(r.left + 18 - px, r.bottom - py);
    if (d < bd && rb.shape !== 'reporter' && rb.shape !== 'boolean') { bd = d; best = { row, pos: 'after' }; }
  });
  $$('#scriptLayer .cbody').forEach(body => {
    if (body.closest('.stack.dragging')) return;
    const r = body.getBoundingClientRect();
    const d = Math.hypot(r.left + 18 - px, r.top + 4 - py);
    if (d < bd) { bd = d; best = { body, pos: 'in' }; }
  });
  if (best) {
    const line = document.createElement('div'); line.className = 'dropline';
    if (best.pos === 'after') best.row.after(line); else best.body.prepend(line);
    dropHint = { ...best, el: line, clear: () => { } };
  }
}

function findAnyBlock(bid, arr) {
  const lists = arr ? [arr] : scripts().map(s => s.blocks);
  for (const list of lists) for (const b of list) {
    if (b.id === bid) return b;
    for (const k of ['children', 'children2']) if (b[k]) { const r = findAnyBlock(bid, b[k]); if (r) return r; }
    for (const k in b.inputs) { const v = b.inputs[k]; if (v && typeof v === 'object') { const r = findAnyBlock(bid, [v]); if (r) return r; } }
  }
  return null;
}

function onPointerUp(e) {
  window.removeEventListener('pointermove', onPointerMove);
  if (!drag) return;
  const { blocks, ghost } = drag;
  const gr = ghost.getBoundingClientRect();
  ghost.remove();
  $('#trash').classList.remove('hot');

  const t = $('#trash').getBoundingClientRect();
  const inTrash = e.clientX > t.left - 10 && e.clientX < t.right + 10 && e.clientY > t.top - 10 && e.clientY < t.bottom + 10;
  const cv = $('#canvas').getBoundingClientRect();
  const insideCanvas = e.clientX > cv.left && e.clientX < cv.right && e.clientY > cv.top && e.clientY < cv.bottom;

  if (inTrash) { clearHint(); drag = null; renderScripts(); toast('Bloque borrado'); return; }

  // MÓVIL: soltar un bloque de la paleta lo envía al código y salta a esa vista
  if (isMobile() && drag.fromPalette && document.body.dataset.pane !== 'canvas') {
    const st = { id: uid(), x: 40, y: nextFreeY(), blocks };
    scripts().push(st);
    clearHint(); drag = null;
    setPane('canvas'); renderScripts(); save();
    toast('Añadido a tu código');
    return;
  }
  if (drag.fromPalette && !insideCanvas && !isMobile() && !dropHint) {
    clearHint(); drag = null; renderScripts(); return;
  }

  if (dropHint) {

      sp.x += sp.vx; sp.y += sp.vy;
      const bx = spriteBox(sp);
      if (bx.l < -SW / 2 || bx.r > SW / 2) { sp.vx *= -1; sp.x = clamp(sp.x, -SW / 2 + 20, SW / 2 - 20); }
      if (bx.t > SH / 2 || bx.b < -SH / 2) { sp.vy *= -1; sp.y = clamp(sp.y, -SH / 2 + 20, SH / 2 - 20); }
      if (sp.pen.down) penLine(sp, ox, oy, sp.x, sp.y); upd(); break;
    }
    case 'ponerEnBorde': {
      const h = 50 * sp.size / 100;
      if (f.borde === 'superior') sp.y = SH / 2 - h; if (f.borde === 'inferior') sp.y = -SH / 2 + h;
      if (f.borde === 'izquierdo') sp.x = -SW / 2 + h; if (f.borde === 'derecho') sp.x = SW / 2 - h;
      upd(); break;
    }

    /* Apariencia */
    case 'decirPor': sp.bubble = { text: f.msg }; upd(); await wait(num(f.s), ctx); sp.bubble = null; upd(); break;
    case 'decir': sp.bubble = String(f.msg).trim() ? { text: f.msg } : null; upd(); break;
    case 'pensarPor': sp.bubble = { text: f.msg, think: true }; upd(); await wait(num(f.s), ctx); sp.bubble = null; upd(); break;
    case 'pensar': sp.bubble = String(f.msg).trim() ? { text: f.msg, think: true } : null; upd(); break;
    case 'cambiarDisfraz': { const i = sp.costumes.findIndex(c => c.name === f.disfraz); if (i >= 0) sp.costume = i; upd(); break; }
    case 'siguienteDisfraz': sp.costume = (sp.costume + 1) % sp.costumes.length; upd(); break;
    case 'cambiarFondo': { const i = P.backdrops.findIndex(c => c.name === f.fondo); if (i >= 0) { P.backdrop = i; fireBackdrop(P.backdrops[i].name); } upd(); break; }
    case 'siguienteFondo': P.backdrop = (P.backdrop + 1) % P.backdrops.length; fireBackdrop(P.backdrops[P.backdrop].name); upd(); break;
    case 'cambiarTam': sp.size = clamp(sp.size + num(f.v), 5, 500); upd(); break;
    case 'fijarTam': sp.size = clamp(num(f.v), 5, 500); upd(); break;
    case 'cambiarEfecto': sp.effects[f.ef] = (sp.effects[f.ef] || 0) + num(f.v); upd(); break;
    case 'fijarEfecto': sp.effects[f.ef] = num(f.v); upd(); break;
    case 'quitarEfectos': sp.effects = { fantasma: 0, brillo: 0, color: 0, pixelar: 0 }; upd(); break;
    case 'mostrar': sp.visible = true; upd(); break;
    case 'esconder': sp.visible = false; upd(); break;
    case 'disfrazAnterior': sp.costume = (sp.costume - 1 + sp.costumes.length) % sp.costumes.length; upd(); break;
    case 'disfrazAzar': sp.costume = Math.floor(Math.random() * sp.costumes.length); upd(); break;
    case 'fondoAzar': P.backdrop = Math.floor(Math.random() * P.backdrops.length); fireBackdrop(P.backdrops[P.backdrop].name); upd(); break;
    case 'cambiarCapas': { const i = P.sprites.indexOf(sp), n = num(f.n) * (f.dir === 'adelante' ? 1 : -1); P.sprites.splice(i, 1); P.sprites.splice(clamp(i + n, 0, P.sprites.length), 0, sp); upd(); break; }
    case 'parpadear': { for (let i = 0; i < num(f.n); i++) { sp.visible = false; upd(); await wait(.15, ctx); sp.visible = true; upd(); await wait(.15, ctx); } break; }
    case 'rebotarTam': { const base = sp.size; for (const k of [1.25, .9, 1.08, 1]) { sp.size = base * k; upd(); await wait(.07, ctx); } sp.size = base; upd(); break; }
    case 'alFrente': { const i = P.sprites.indexOf(sp); P.sprites.splice(i, 1); f.capa === 'frontal' ? P.sprites.push(sp) : P.sprites.unshift(sp); upd(); break; }

    /* Sonido */
    case 'tocarSonido': { const s = sp.sounds.find(x => x.name === f.snd); if (s) playSound(s.kind, sp.volume); break; }
    case 'tocarSonidoHasta': { const s = sp.sounds.find(x => x.name === f.snd); if (s) { const d = playSound(s.kind, sp.volume); await wait(d, ctx); } break; }
    case 'pararSonidos': if (AC) { AC.close(); AC = null; } break;
    case 'tocarNota': playNote(num(f.nota), num(f.s), sp.volume); await wait(num(f.s), ctx); break;
    case 'tocarMelodia': {
      const M2 = { alegre: [60, 64, 67, 72], triste: [69, 67, 64, 60], victoria: [60, 64, 67, 72, 76], misterio: [61, 63, 66, 61], fanfarria: [67, 67, 67, 72] };
      for (const n2 of (M2[f.mel] || M2.alegre)) { playNote(n2 + (sp.tono || 0), .22, sp.volume); await wait(.22, ctx); } break;
    }
    case 'tocarTambor': { playSound({ bombo: 'drum', caja: 'clap', 'platillo': 'bell', tom: 'boing', palmada: 'clap' }[f.t] || 'drum', sp.volume); await wait(num(f.s), ctx); break; }
    case 'silencio': await wait(num(f.s), ctx); break;
    case 'cambiarTono': sp.tono = (sp.tono || 0) + num(f.v); break;
    case 'fijarTono': sp.tono = num(f.v); break;
    case 'cambiarVol': sp.volume = clamp(sp.volume + num(f.v), 0, 100); break;
    case 'fijarVol': sp.volume = clamp(num(f.v), 0, 100); break;

    /* Eventos */
    case 'enviar': P.ultimoMsg = f.msg; broadcast(f.msg); break;
    case 'enviarEsperar': P.ultimoMsg = f.msg; await Promise.all(broadcast(f.msg)); break;

    /* Control */
    case 'esperar': await wait(num(f.s), ctx); break;
    case 'repetir': { const n = num(f.n); for (let i = 0; i < n; i++) { if (ctx.stopped()) throw new StopSignal(); await runStack(b.children, ctx); await frame(); } break; }
    case 'porSiempre': while (true) { if (ctx.stopped()) throw new StopSignal(); await runStack(b.children, ctx); await frame(); } 
    case 'si': if (await A('cond')) await runStack(b.children, ctx); break;
    case 'siSino': if (await A('cond')) await runStack(b.children, ctx); else await runStack(b.children2, ctx); break;
    case 'esperarHasta': while (!(await A('cond'))) { if (ctx.stopped()) throw new StopSignal(); await frame(); } break;
    case 'repetirHasta': while (!(await A('cond'))) { if (ctx.stopped()) throw new StopSignal(); await runStack(b.children, ctx); await frame(); } break;
    case 'esperarFrames': { for (let i = 0; i < num(f.n); i++) { if (ctx.stopped()) throw new StopSignal(); await frame(); } break; }
    case 'repetirDesde': {
      const a = num(f.a), b2 = num(f.b), paso = b2 >= a ? 1 : -1;
      for (let i = a; paso > 0 ? i <= b2 : i >= b2; i += paso) {
        if (ctx.stopped()) throw new StopSignal();
        ctx.contador = i; await runStack(b.children, ctx); await frame();
      } break;
    }
    case 'mientras': while (await A('cond')) { if (ctx.stopped()) throw new StopSignal(); await runStack(b.children, ctx); await frame(); } break;
    case 'siNoEntonces': if (!(await A('cond'))) await runStack(b.children, ctx); break;
    case 'detener': if (f.q === 'todos') { stopAll(); throw new StopSignal(); } else throw new StopSignal();
    case 'crearClon': { crearClon(sp); break; }
    case 'borrarClon': if (sp.isClone) { P.sprites = P.sprites.filter(s => s !== sp); upd(); } throw new StopSignal();

    /* Sensores */
    case 'preguntar': { sp.bubble = { text: f.q }; upd(); answer = await ask(f.q, ctx); sp.bubble = null; upd(); break; }
    case 'reiniciarCrono': timerStart = Date.now(); break;

    /* Variables */
    case 'fijarVar': P.vars[f.v] = await A('val'); renderMonitors(); break;
    case 'cambiarVar': P.vars[f.v] = num(P.vars[f.v]) + num(f.val); renderMonitors(); break;
    case 'mostrarVar': P.varsShown[f.v] = true; renderMonitors(); break;
    case 'esconderVar': P.varsShown[f.v] = false; renderMonitors(); break;
    case 'anadirLista': (P.lists[f.l] ||= []).push(await A('val')); break;
    case 'borrarElem': { const l = P.lists[f.l] || []; const i = num(f.i) - 1; if (i >= 0 && i < l.length) l.splice(i, 1); break; }
    case 'insertarEn': { const l = (P.lists[f.l] ||= []); l.splice(clamp(num(f.i) - 1, 0, l.length), 0, await A('val')); break; }
    case 'reemplazarEn': { const l = P.lists[f.l] || []; const i = num(f.i) - 1; if (i >= 0 && i < l.length) l[i] = await A('val'); break; }
    case 'borrarLista': P.lists[f.l] = []; break;

    /* Lápiz */
    case 'borrarLapiz': penCtx().clearRect(0, 0, SW, SH); break;
    case 'bajarLapiz': sp.pen.down = true; break;
    case 'subirLapiz': sp.pen.down = false; break;
    case 'colorLapiz': sp.pen.color = f.col; break;
    case 'grosorLapiz': sp.pen.size = num(f.v); break;
    case 'cambiarColorLapiz': { sp.pen.color = shiftHue(sp.pen.color, num(f.v) * 3.6); break; }
    case 'colorAzarLapiz': sp.pen.color = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'); break;
    case 'cambiarGrosor': sp.pen.size = clamp(sp.pen.size + num(f.v), 1, 50); break;
    case 'transpLapiz': sp.pen.alpha = 1 - clamp(num(f.v), 0, 100) / 100; break;
    case 'dibujarCirculo': {
      const g = penCtx(); g.save(); g.globalAlpha = sp.pen.alpha ?? 1;
      g.strokeStyle = sp.pen.color; g.lineWidth = sp.pen.size;
      g.beginPath(); g.arc(sp.x + SW / 2, SH / 2 - sp.y, Math.abs(num(f.r)), 0, Math.PI * 2); g.stroke(); g.restore(); break;
    }
    case 'dibujarPoligono': {
      const n2 = Math.max(3, num(f.n)), t = num(f.t), g = penCtx();
      g.save(); g.globalAlpha = sp.pen.alpha ?? 1; g.strokeStyle = sp.pen.color; g.lineWidth = sp.pen.size;
      g.beginPath();
      for (let i = 0; i <= n2; i++) {
        const ang = (i / n2) * Math.PI * 2 + (sp.dir - 90) * Math.PI / 180;
        const px = sp.x + SW / 2 + Math.cos(ang) * t, py = SH / 2 - sp.y + Math.sin(ang) * t;
        i ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.stroke(); g.restore(); break;
    }
    case 'escribirTexto': {
      const g = penCtx(); g.save(); g.globalAlpha = sp.pen.alpha ?? 1;
      g.fillStyle = sp.pen.color; g.font = `bold ${num(f.n)}px Arial, Helvetica, sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(f.txt), sp.x + SW / 2, SH / 2 - sp.y); g.restore(); break;
    }
    case 'sello': { const g = penCtx(); const im = new Image(); im.src = sp.costumes[sp.costume].src; await new Promise(r => { im.onload = r; im.onerror = r; }); const s = 100 * sp.size / 100; g.save(); g.translate(sp.x + SW / 2, SH / 2 - sp.y); g.rotate((sp.dir - 90) * Math.PI / 180); g.drawImage(im, -s / 2, -s / 2, s, s); g.restore(); break; }
  }
}

function wrapDir(d) { d = ((d + 180) % 360 + 360) % 360 - 180; return d === -180 ? 180 : d; }
function clampStage(sp) { sp.x = clamp(sp.x, -SW / 2 - 20, SW / 2 + 20); sp.y = clamp(sp.y, -SH / 2 - 20, SH / 2 + 20); }
async function wait(sec, ctx) {
  const end = performance.now() + sec * 1000;
  while (performance.now() < end) { if (ctx.stopped()) throw new StopSignal(); await frame(); }
}
function ask(q, ctx) {
  return new Promise(res => {
    const box = $('#askBox'); box.style.display = 'flex';
    const inp = $('#askInput'); inp.value = ''; inp.placeholder = q; inp.focus();
    const done = () => { box.style.display = 'none'; $('#askOk').onclick = null; inp.onkeydown = null; res(inp.value); };
    $('#askOk').onclick = done;
    inp.onkeydown = e => { if (e.key === 'Enter') done(); };
  });
}

function crearClon(sp) {
  const c = JSON.parse(JSON.stringify({ ...sp, scripts: [] }));
  c.id = uid(); c.isClone = true; c.scripts = sp.scripts; c.name = sp.name;
  P.sprites.push(c); renderStage();
  startHats(c, b => b.op === 'alClonar');
}

/* --- hilos --- */
function mkCtx(sprite) { let dead = false; const c = { sprite, stopped: () => !running || dead, kill: () => dead = true }; return c; }

function startHats(sprite, pred) {
  const list = (sprite ? sprite.scripts : P.stageScripts);
  const out = [];
  list.forEach(st => {
    const head = st.blocks[0];
    if (!head || !pred(head)) return;
    const ctx = mkCtx(sprite || P.sprites[0]);
    threads.push(ctx);
    const p = runStack(st.blocks.slice(1), ctx).catch(e => { if (!(e instanceof StopSignal)) console.error(e); });
    out.push(p);
  });
  return out;
}

function allTargets() { return P.sprites; }
function broadcast(msg) {
  let ps = [];
  allTargets().forEach(sp => ps.push(...startHats(sp, b => b.op === 'alRecibir' && b.fields.msg === msg)));
  return ps;
}
function fireBackdrop(name) { allTargets().forEach(sp => startHats(sp, b => b.op === 'alFondo' && b.fields.fondo === name)); }

function greenFlag() {
  stopAll(); running = true; timerStart = Date.now();
  if (AC?.state === 'suspended') AC.resume();
  $('#flag').classList.add('glow');
  allTargets().forEach(sp => startHats(sp, b => b.op === 'alBandera' || b.op === 'alCargar'));
  startHats(null, b => b.op === 'alBandera' || b.op === 'alCargar');
  startWatchers();
}

/* Vigila los sombreros que dependen de una condición continua:
   "al tocar X" y "cuando cronómetro > N" (se disparan al pasar de falso a verdadero) */
let watchTimer = null;
const watchState = new Map();
function startWatchers() {
  clearInterval(watchTimer);
  watchState.clear();
  watchTimer = setInterval(() => {
    if (!running) return;
    P.sprites.forEach(sp => sp.scripts.forEach(st => {
      const h = st.blocks[0];
      if (!h) return;
      let on = false;
      if (h.op === 'alTocarObj') on = isTouching(sp, h.fields.obj);
      else if (h.op === 'alMayorQue') {
        const v = h.fields.q === 'cronómetro' ? (Date.now() - timerStart) / 1000 : 0;
        on = v > num(h.fields.v);
      } else return;
      const key = sp.id + st.id, prev = watchState.get(key) || false;
      watchState.set(key, on);
      if (on && !prev) {
        const ctx = mkCtx(sp); threads.push(ctx);
        runStack(st.blocks.slice(1), ctx).catch(e => { if (!(e instanceof StopSignal)) console.error(e); });
      }
    }));
  }, 100);
}
function stopAll() {
  running = false; clearInterval(watchTimer); watchTimer = null; watchState.clear();
  threads.forEach(t => t.kill()); threads = [];
  P.sprites = P.sprites.filter(s => !s.isClone);
  $('#flag').classList.remove('glow');
  $('#askBox').style.display = 'none';
  renderStage();
}

/* teclado / ratón */
window.addEventListener('keydown', e => {
  keysDown.add(e.key.toLowerCase());
  if (running) allTargets().forEach(sp => startHats(sp, b => b.op === 'alTecla' && (b.fields.tecla === 'cualquiera' || matchKey(b.fields.tecla, e.key))));
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && e.target === document.body) e.preventDefault();
});
window.addEventListener('keyup', e => keysDown.delete(e.key.toLowerCase()));
function matchKey(name, key) {
  const map = { 'espacio': ' ', 'flecha arriba': 'arrowup', 'flecha abajo': 'arrowdown', 'flecha derecha': 'arrowright', 'flecha izquierda': 'arrowleft' };
  return (map[name] || name).toLowerCase() === key.toLowerCase();
}

/* ================== Interacción escenario ================== */
function initStageEvents() {
  const st = $('#stage');
  const toStage = e => { const r = st.getBoundingClientRect(), k = SW / r.width; return { x: (e.clientX - r.left) * k - SW / 2, y: SH / 2 - (e.clientY - r.top) * k * (SW / SH) / (SW / SH) }; };
  st.addEventListener('pointermove', e => { const r = st.getBoundingClientRect(); mouse.x = clamp((e.clientX - r.left) / r.width * SW - SW / 2, -240, 240); mouse.y = clamp(SH / 2 - (e.clientY - r.top) / r.height * SH, -180, 180); });
  st.addEventListener('pointerdown', e => {
    mouse.down = true;
    const t = e.target.closest('.sprite');
    if (t) { const sp = P.sprites.find(s => s.id === t.dataset.id); if (sp && running) startHats(sp, b => b.op === 'alClicObjeto'); if (sp && !running) { selectSprite(sp); dragSpriteStart(e, sp); } }
  });
  window.addEventListener('pointerup', () => mouse.down = false);
}
function dragSpriteStart(e, sp) {
  const st = $('#stage'), r = st.getBoundingClientRect();
  const move = ev => { sp.x = clamp((ev.clientX - r.left) / r.width * SW - SW / 2, -240, 240); sp.y = clamp(SH / 2 - (ev.clientY - r.top) / r.height * SH, -180, 180); renderStage(); syncSpriteFields(); };
  const up = () => { window.removeEventListener('pointermove', move); save(); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up, { once: true });
}

const CAT_NOTE = {
  motion: 'Mueve, gira y coloca a tu personaje por el escenario (480 × 360).',

/* ================== UI: sprites ================== */

function refreshAll() { renderCats(); renderPalette(); renderScripts(); renderStage(); renderSprites(); renderAssets(); }

/* ================== Disfraces y sonidos ================== */
let assetTab = 'costumes';
function renderAssets() {
  const pane = $('#assetsPane'); if (!sel) return;
  pane.innerHTML = '';
    if (assetTab === 'costumes') {
    sel.costumes.forEach((c, i) => {
      const row = document.createElement('div'); row.className = 'asset-row';
      row.innerHTML = `<div class="thumbbox"><img src="${c.src}"></div><div><div class="nm">${i + 1}. ${c.name}</div><div class="sub">${i === sel.costume ? '<i class="dot"></i>en uso' : 'disfraz'}</div></div>`;
      const acts = document.createElement('div'); acts.className = 'acts';
      const use = mk('Usar', () => { sel.costume = i; renderStage(); renderSprites(); });
      const ren = mk('Nombre', () => { const n = prompt('Nuevo nombre:', c.name); if (n) { c.name = n; renderAssets(); renderPalette(); save(); } });
      const del = mk('Borrar', () => { if (sel.costumes.length > 1) { sel.costumes.splice(i, 1); sel.costume = 0; refreshAll(); save(); } }, true);
      acts.append(use, ren, del); row.append(acts); pane.append(row);
    });
    pane.append(mk('Añadir disfraz desde la biblioteca', () => openPicker('costume'), false, true, 'plus'));
  } else {
    sel.sounds.forEach((s, i) => {
      const row = document.createElement('div'); row.className = 'asset-row';
      row.innerHTML = `<div class="thumbbox"><span class="ic ic-note ic-lg"></span></div><div><div class="nm">${i + 1}. ${s.name}</div><div class="sub">efecto de sonido</div></div>`;
      const acts = document.createElement('div'); acts.className = 'acts';
      acts.append(mk('Oír', () => playSound(s.kind, 100)), mk('Borrar', () => { sel.sounds.splice(i, 1); renderAssets(); renderPalette(); save(); }, true));
      row.append(acts); pane.append(row);
    });
    pane.append(mk('Añadir sonido', () => openPicker('sound'), false, true, 'plus'));
  }
}
function mk(txt, fn, red, block, icon) {
  const b = document.createElement('button');
  b.className = block ? 'bigadd' : ('minibtn' + (red ? ' red' : ''));
  b.innerHTML = (icon ? `<span class="ic ic-${icon}"></span> ` : '') + txt;
  b.onclick = fn;
  return b;
}

/* ================== Selector (biblioteca) ==================
   Navegación en 2 niveles: categoría -> subcategoría, con buscador
   y carga por lotes. En móvil se comporta como hoja deslizante.     */
function openPicker(kind) {
  const m = $('#picker'), body = $('#pickerBody');
  const titles = { sprite: 'Personajes', costume: 'Disfraces', backdrop: 'Fondos', sound: 'Sonidos' };
  $('#pickerTitle').textContent = titles[kind];
  body.innerHTML = ''; body.scrollTop = 0;

  let items = [], cats = [];
  if (kind === 'sprite' || kind === 'costume') {
    items = LIBRARY.map(it => ({ lib: it, name: it.name, tags: it.tags || [], cat: it.cat, sub: it.sub, destacado: it.destacado }));
    cats = SPRITE_CATS;
  } else if (kind === 'backdrop') {
    items = BACKDROPS.map(b => ({ bd: b, name: b.name, tags: b.tags || [], cat: b.cat, sub: b.sub, destacado: b.destacado }));
    cats = BACKDROP_CATS;
  } else {
    items = SOUNDS.map(s => ({ snd: s, name: s.name, tags: [], cat: '', sub: '' }));
    cats = [{ id: '', name: 'Todos', icon: 'note' }];
  }

  let catSel = '', subSel = '', q = '';

  /* --- barra de búsqueda --- */
  const bar = document.createElement('div'); bar.className = 'pickbar';
  const sWrap = document.createElement('div'); sWrap.className = 'searchwrap';
  const search = document.createElement('input');
  search.className = 'picksearch'; search.type = 'search';
  search.placeholder = `Buscar entre ${items.length.toLocaleString('es')}…`;
  sWrap.append(search); bar.append(sWrap);

  /* --- fila de categorías --- */
  const catRow = document.createElement('div'); catRow.className = 'catrow';
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'catchip' + (c.id === catSel ? ' on' : '');
    b.innerHTML = `<span class="ci ic ic-${c.icon}"></span><span>${c.name}</span>`;
    b.onclick = () => {
      catSel = c.id; subSel = ''; q = ''; search.value = '';
      [...catRow.children].forEach(x => x.classList.remove('on')); b.classList.add('on');
      buildSubs(); refresh(); body.scrollTo({ top: 0, behavior: 'smooth' });
    };
    catRow.append(b);
  });
  bar.append(catRow);

  /* --- fila de subcategorías --- */
  const subRow = document.createElement('div'); subRow.className = 'subrow';
  bar.append(subRow);
  function buildSubs() {
    subRow.innerHTML = '';
    if (catSel === 'destacados' || kind === 'sound') { subRow.style.display = 'none'; return; }
    const subs = subsOf(items, catSel);
    if (subs.length < 2) { subRow.style.display = 'none'; return; }
    subRow.style.display = 'flex';
    const mk = (label, val) => {
      const b = document.createElement('button');
      b.className = 'subchip' + (val === subSel ? ' on' : '');
      b.textContent = label;
      b.onclick = () => { subSel = val; [...subRow.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); refresh(); };
      subRow.append(b);
    };
    mk('Todo', '');
    subs.forEach(x => mk(x, x));
  }

  const count = document.createElement('div'); count.className = 'pickcount';
  const g = document.createElement('div'); g.className = 'grid';
  const more = document.createElement('div'); more.className = 'pickmore';
  body.append(bar, count, g, more);

  let filtered = items, shown = 0;
  const PAGE = 60;

  const choose = it => {
    if (kind === 'sprite') {
      const sp = nuevoSprite(it.lib, Math.round(Math.random() * 200 - 100), Math.round(Math.random() * 120 - 60));
      let n = 2, base = sp.name; while (P.sprites.some(s => s.name === sp.name)) sp.name = base + ' ' + n++;
      P.sprites.push(sp); sel = sp; refreshAll(); toast(`${sp.name} añadido`);
    }
    if (kind === 'costume') { it.lib.costumes.forEach(c => sel.costumes.push({ ...c })); renderAssets(); renderPalette(); toast('Disfraz añadido'); }
    if (kind === 'backdrop') {
      const bd = { name: it.bd.name, src: it.bd.src };
      if (!P.backdrops.some(x => x.name === bd.name)) P.backdrops.push(bd);
      P.backdrop = P.backdrops.findIndex(x => x.name === bd.name); refreshAll(); toast('Fondo aplicado');
    }
    if (kind === 'sound') { if (!sel.sounds.some(x => x.name === it.snd.name)) sel.sounds.push({ ...it.snd }); playSound(it.snd.kind); renderAssets(); renderPalette(); toast('Sonido añadido'); }
    closePicker(); save();
  };

  const card = it => {
    const b = document.createElement('button'); b.className = 'pick';
    let thumb;
    if (kind === 'sound') thumb = `<div class="sn"><span class="ic ic-note"></span></div>`;
    else if (it.bd) thumb = `<img loading="lazy" src="${it.bd.src}" class="bdthumb">`;
    else thumb = `<img loading="lazy" src="${it.lib.costumes[0].src}">`;
    b.innerHTML = thumb + `<div>${it.name}</div>`;
    b.onclick = () => choose(it);
    return b;
  };

  const renderBatch = () => {
    const slice = filtered.slice(shown, shown + PAGE);
    const frag = document.createDocumentFragment();
    slice.forEach(it => frag.append(card(it)));
    g.append(frag); shown += slice.length;
    more.textContent = shown < filtered.length ? `Desliza para ver más · ${shown} de ${filtered.length}` : (filtered.length ? '— fin de la lista —' : '');
  };
  const refresh = () => {
    filtered = items.filter(i =>
      (catSel === 'destacados' ? i.destacado : (!catSel || i.cat === catSel)) &&
      (!subSel || i.sub === subSel) &&
      (!q || i.name.toLowerCase().includes(q)));
    g.innerHTML = ''; shown = 0;
    count.textContent = filtered.length
      ? `${filtered.length.toLocaleString('es')} resultado${filtered.length === 1 ? '' : 's'}`
      : 'Sin resultados — prueba otra palabra';
    renderBatch();
  };
  let tmr; search.oninput = () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => {
      q = search.value.trim().toLowerCase();
      if (q) { // buscar en todo el catálogo
        catSel = ''; subSel = '';
        [...catRow.children].forEach((x, i) => x.classList.toggle('on', i === 0));
        buildSubs();
      }
      refresh();
    }, 150);
  };
  body.onscroll = () => {
    if (shown < filtered.length && body.scrollTop + body.clientHeight > body.scrollHeight - 320) renderBatch();
  };

  buildSubs(); refresh();
  m.classList.add('open'); document.body.classList.add('modal-open');
  if (window.innerWidth > 900) setTimeout(() => search.focus(), 80);
}
function closePicker() {
  $('#picker').classList.remove('open');
  document.body.classList.remove('modal-open');
}

/* ================== Guardado ================== */
function save() { try { localStorage.setItem('scratchito', JSON.stringify(P)); } catch (e) { } }
function load() {
  try { const s = localStorage.getItem('scratchito'); if (s) { const p = JSON.parse(s); if (p?.sprites?.length) return p; } } catch (e) { }
  return null;
}

    document.body.dataset.pane = p;
    $$('.codeswitch button').forEach(x => x.classList.toggle('on', x.dataset.pane === p));
  };
  window.setView = setView; window.setPane = setPane;
  $$('.mobile-tabs button').forEach(b => b.onclick = () => setView(b.dataset.view));
  $$('.codeswitch button').forEach(b => b.onclick = () => setPane(b.dataset.pane));

  // barra de ejecución móvil
  $('#mFlag').onclick = () => { if (AC?.state === 'suspended') AC.resume(); greenFlag(); if (window.innerWidth <= 900) setView('stage'); };
  $('#mStop').onclick = stopAll;
  $('#mMenu').onclick = () => openMobileMenu();

  if (window.innerWidth <= 900) { setView('stage'); setPane('palette'); }

  // tamaños de escenario
  $$('.size-btns button').forEach(b => b.onclick = () => {
    $$('.size-btns button').forEach(x => x.classList.remove('active')); b.classList.add('active');
    const m = b.dataset.mode;
    const w = m === 'small' ? '300px' : m === 'big' ? '520px' : '392px';
    const col = $('.stage-col'); col.style.flexBasis = w; col.style.width = w;
    setTimeout(renderStage, 80);
  });

  // zoom del lienzo
  let zoom = 1;
  const applyZoom = () => { layer().style.transform = `scale(${zoom})`; };
  $('#zin').onclick = () => { zoom = clamp(zoom + .15, .5, 2); applyZoom(); };
  $('#zout').onclick = () => { zoom = clamp(zoom - .15, .5, 2); applyZoom(); };
  $('#zreset').onclick = () => { zoom = 1; applyZoom(); };

  // nombre de proyecto
  $('#projName').value = P.name || 'Mi proyecto';
  $('#projName').oninput = e => { P.name = e.target.value; $('#mName').textContent = e.target.value; save(); };

  $('#btnFull').onclick = () => {
    const el = document.querySelector('.stage-card-main');
    if (document.fullscreenElement) document.exitFullscreen();

  };
  document.addEventListener('fullscreenchange', () => setTimeout(renderStage, 120));

  window.addEventListener('resize', () => renderStage());
  refreshAll();
  initTutorial();
  if (!localStorage.getItem('scratchito_visto')) { $('#tutorial').classList.add('open'); localStorage.setItem('scratchito_visto', '1'); }
}

const bk = (op, fields = {}, inputs = {}, children = null, children2 = null) => {
  const b = nuevoBloque(op);
  Object.assign(b.fields, fields);
  for (const k in inputs) b.inputs[k] = inputs[k];
  if (children) b.children = children;
  if (children2) b.children2 = children2;
  return b;
};

function openExamples() {
  const m = document.querySelector('#picker'), body = document.querySelector('#pickerBody');
  document.querySelector('#pickerTitle').textContent = 'Proyectos de ejemplo (se cargan listos para jugar)';
  body.innerHTML = '';
  EJEMPLOS().forEach(ex => {
    const b = document.createElement('button');
    b.className = 'example-card';
    b.innerHTML = `<b>${ex.name}</b><span>${ex.desc}</span>`;
    b.onclick = () => {
      if (!confirm('Se cargará el ejemplo y se sustituirá tu proyecto actual. ¿Seguir?')) return;
      P = ex.build(); sel = P.sprites[0]; refreshAll(); save();
      m.classList.remove('open');
      toast('Ejemplo cargado · pulsa  para jugar');
      greenFlag();
    };
    body.append(b);
  });
  m.classList.add('open');
}
